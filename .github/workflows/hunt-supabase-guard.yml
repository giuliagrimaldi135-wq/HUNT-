name: HUNT Supabase Guard
# Unattended check of the Supabase egress guard (PR B). Reads ONE small public
# status record (public.hunt_egress_alert: codes and level only, no user data,
# a few hundred bytes) four times a day. Opens a single GitHub issue when the
# guard needs attention (GitHub e-mails the repository owner), updates it when
# the codes change, and closes it when everything is back to normal.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hunt-supabase-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Public values, already shipped in hunt2-preview/app.js.
      SUPABASE_URL: https://dfiokxjfgqoboxckcuut.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_9F3UoJWHMYSKSGqTibcZDg_VMRCGsI_
    steps:
      - name: Read guard status and keep one incident in sync
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = 'HUNT · protezione consumi Supabase';
            const explain = {
              supabase_restricted_402: 'Supabase risponde HTTP 402: progetto limitato per quota. Le scansioni restano sospese dal watchdog finché il servizio non torna disponibile.',
              quota_402_suspended: 'Il watchdog ha sospeso gli scanner dopo un HTTP 402 e attende due controlli riusciti per ripartire in modalità economy.',
              budget_pause: 'Il budget giornaliero o il ritmo del ciclo è esaurito: scanner in pausa, ripartenza automatica il giorno UTC successivo.',
              meter_silent: 'Il misuratore dei consumi non registra nulla da oltre 3 ore mentre gli scanner sono attivi: HUNT è scesa al livello minimo.',
              telemetry_untrusted: 'Da oltre 24 ore alcune funzioni hanno misure mancanti, a zero, obsolete o incomplete: HUNT non supera il livello economy.',
              cycle_usage_high: 'Il consumo stimato o osservato del ciclo ha superato il 70% della quota Free.',
              watchdog_not_running: 'Il watchdog non aggiorna lo stato da oltre 90 minuti (cron fermo o database non raggiungibile).',
              guard_not_started: 'La protezione è installata ma il watchdog non ha ancora registrato uno stato.'
            };
            let result = null, httpStatus = 0;
            for (let attempt = 1; attempt <= 3 && !result; attempt++) {
              try {
                const res = await fetch(process.env.SUPABASE_URL + '/rest/v1/rpc/hunt_egress_alert', {
                  method: 'POST',
                  headers: {apikey: process.env.SUPABASE_PUBLISHABLE_KEY, 'content-type': 'application/json'},
                  body: '{}', signal: AbortSignal.timeout(15000)
                });
                httpStatus = res.status;
                if (res.status === 402) result = {ok: false, alerts: ['supabase_restricted_402'], info: []};
                else if (res.ok) result = await res.json();
                else if (res.status === 404) break;
              } catch (e) {
                core.info('Tentativo ' + attempt + ' non riuscito: ' + e.message);
              }
              if (!result && attempt < 3) await new Promise(r => setTimeout(r, 3000));
            }
            if (!result) {
              // 404: guard migration not applied yet. Network/5xx: unknown.
              // Neither is proof of a problem, so the incident is not touched.
              core.warning(httpStatus === 404
                ? 'Protezione consumi non ancora installata su Supabase (funzione assente).'
                : 'Stato non verificabile (HTTP ' + httpStatus + '): nessuna modifica agli incidenti.');
              return;
            }
            const alerts = Array.isArray(result.alerts) ? result.alerts : [];
            const info = Array.isArray(result.info) ? result.info : [];
            await core.summary.addHeading('HUNT · protezione consumi Supabase')
              .addTable([
                [{data: 'Campo', header: true}, {data: 'Valore', header: true}],
                ['Livello scansione', String(result.level || 'n/d')],
                ['Allerta', alerts.join(', ') || 'nessuna'],
                ['Informazioni', info.join(', ') || 'nessuna'],
                ['Ultimo controllo watchdog', String(result.checked_at || 'n/d')]
              ]).write();
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const incident = open.find(i => !i.pull_request && i.title === title);
            if (alerts.length) {
              const body = [
                'Il controllo automatico della protezione consumi ha rilevato:',
                '',
                ...alerts.map(code => '- `' + code + '`: ' + (explain[code] || 'codice non documentato')),
                '',
                'Livello di scansione: `' + (result.level || 'n/d') + '`. Informazioni: ' + (info.join(', ') || 'nessuna') + '.',
                'Dettagli e ora dell\'ultimo controllo nel riepilogo delle esecuzioni del workflow "HUNT Supabase Guard".',
                '',
                'Questo incidente si aggiorna senza nuovi commenti e si chiude da solo quando i codici tornano regolari.',
                'Nota: la misura interna non copre tutto il traffico fatturato da Supabase; la protezione riduce il rischio di blocco 402 ma non lo esclude.'
              ].join('\n');
              if (!incident) {
                await github.rest.issues.create({owner, repo, title, body});
                core.warning('Aperto incidente: ' + alerts.join(', '));
              } else if (incident.body !== body) {
                await github.rest.issues.update({owner, repo, issue_number: incident.number, body});
              }
            } else if (incident) {
              await github.rest.issues.update({owner, repo, issue_number: incident.number, state: 'closed'});
              core.info('Protezione consumi regolare: incidente chiuso.');
            }
