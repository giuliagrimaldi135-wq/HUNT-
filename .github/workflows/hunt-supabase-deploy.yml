name: HUNT Supabase Functions Deploy
# Publishes Edge Functions from the reviewed code on main to the Supabase
# project "Hunt 2". Runs ONLY when started by hand (Actions -> this workflow ->
# Run workflow). Requires the repository secret SUPABASE_ACCESS_TOKEN (a
# personal access token created by the project owner in the Supabase
# dashboard; never pasted in chat or committed).
# It does not apply migrations and does not enable cron jobs or scanners.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy (space separated). Default: the 13 scheduled functions."
        required: false
        default: "hunt-match-refresh hunt-ats-board-scan hunt-ats-discovery hunt-brand-website-repair hunt-company-intelligence hunt-description-repair hunt-fashion-brand-discovery hunt-global-news hunt-intelligence-source-discovery hunt-news-source-sync hunt-source-discovery hunt-successfactors-public hunt-vacancy-monitor"

permissions:
  contents: read

concurrency:
  group: hunt-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dfiokxjfgqoboxckcuut
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Test before publishing (matcher equivalence and usage meter)
        run: |
          (cd v2/supabase/functions/hunt-match-refresh && deno test --allow-run --allow-env --allow-read equivalence/equivalence.test.ts)
          (cd v2/supabase/shared && deno test --allow-net --allow-env --allow-read usage-meter.test.ts)
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy selected functions (verify_jwt stays off, as in production)
        working-directory: v2
        run: |
          set -euo pipefail
          for fn in ${{ github.event.inputs.functions }}; do
            case "$fn" in hunt-*) ;; *) echo "::error::refusing unexpected function name $fn"; exit 1;; esac
            test -f "supabase/functions/$fn/index.ts" || { echo "::error::missing $fn"; exit 1; }
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
      - name: List deployed versions
        working-directory: v2
        run: supabase functions list --project-ref "$PROJECT_REF"
