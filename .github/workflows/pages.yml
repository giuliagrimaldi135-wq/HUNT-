name: Deploy HUNT
on:
  push:
    branches: [main]
    paths:
      - 'hunt2-preview/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'config/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block deployment if HUNT dossier, CV or letter regressions fail
        run: |
          node --check hunt2-preview/app.js
          node --check hunt2-preview/cv-profile.js
          node --check hunt2-preview/cv-reader.js
          node --check hunt2-preview/cv-interpreter.js
          node --check hunt2-preview/dossier-intelligence.js
          node --test hunt2-preview/tests/dossier-regression.test.mjs hunt2-preview/tests/dossier-intelligence.test.mjs hunt2-preview/tests/letter-editorial.test.mjs hunt2-preview/tests/cv-interpreter.test.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
