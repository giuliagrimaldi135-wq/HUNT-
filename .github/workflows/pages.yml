name: Deploy HUNT
on:
  push:
    branches: [main]
    paths:
      - 'hunt2-preview/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'config/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Publish the latest interface rather than queuing every intermediate UI commit.
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the public outreach evidence feed without personalized drafts
        run: node hunt2-preview/build-outreach-public.mjs
      - name: Block deployment if HUNT dossier, CV or letter regressions fail
        run: |
          node --check hunt2-preview/app.js
          node --check hunt2-preview/cv-profile.js
          node --check hunt2-preview/cv-reader.js
          node --check hunt2-preview/cv-interpreter.js
          node --check hunt2-preview/cv-display.js
          node --check hunt2-preview/cv-ranking.js
          node --check hunt2-preview/opportunity-similarity.js
          node --check hunt2-preview/job-workspace.js
          node --check hunt2-preview/outreach-intelligence.js
          node --check hunt2-preview/build-outreach-public.mjs
          node --check hunt2-preview/cv-workspace.js
          node --check hunt2-preview/requirement-priority.js
          node --check hunt2-preview/dossier-intelligence.js
          node --test hunt2-preview/tests/dossier-regression.test.mjs hunt2-preview/tests/dossier-intelligence.test.mjs hunt2-preview/tests/letter-editorial.test.mjs hunt2-preview/tests/cv-interpreter.test.mjs hunt2-preview/tests/cv-display.test.mjs hunt2-preview/tests/cv-ranking.test.mjs hunt2-preview/tests/opportunity-similarity.test.mjs hunt2-preview/tests/cv-profile-smoke.test.mjs hunt2-preview/tests/job-workspace.test.mjs hunt2-preview/tests/cv-workspace.test.mjs hunt2-preview/tests/outreach-intelligence.test.mjs hunt2-preview/tests/requirement-priority.test.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
