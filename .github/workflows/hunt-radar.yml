name: HUNT Radar
# HUNT matcher v1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/hunt-radar.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: hunt-radar
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Scan career sources
        run: python scripts/scan_jobs.py
      - name: Scan public expansion/news signals
        run: python scripts/scan_news.py
      - name: Create high-priority alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_github.py
      - name: Send HUNT push alerts
        env:
          ONESIGNAL_APP_ID: "86341c64-d62a-4983-9e20-c242566d14ff"
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/notify_onesignal.py
      - name: Persist radar data
        id: persist
        run: |
          mkdir -p /tmp/hunt-data
          cp data/*.json /tmp/hunt-data/
          rm -f /tmp/hunt-data/chatgpt_alerts.json /tmp/hunt-data/chatgpt_outreach.json
          git config user.name "HUNT Radar"
          git config user.email "actions@users.noreply.github.com"
          CHANGED=false
          PERSISTED=false
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hunt-data/*.json data/
            git add data/
            if git diff --cached --quiet; then
              echo "No new data to publish"
              PERSISTED=true
              break
            fi
            git commit -m "radar: update opportunities"
            if git push origin HEAD:main; then
              CHANGED=true
              PERSISTED=true
              break
            fi
            echo "::warning::Concurrent repository write; retry $ATTEMPT of 5"
            sleep $((ATTEMPT * 2))
          done
          if [ "$PERSISTED" != "true" ]; then
            echo "::error::HUNT Radar could not persist its refreshed data after 5 attempts"
            exit 1
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

