name: HUNT Radar
# HUNT matcher v1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/hunt-radar.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: hunt-radar
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Scan public jobs and fashion signals with bounded retry
        id: scan_data
        continue-on-error: true
        run: |
          for ATTEMPT in 1 2; do
            # Never persist partial JSON after a failed scan; every retry uses a clean checkout.
            git restore -- data/
            if python scripts/scan_jobs.py && python scripts/scan_news.py; then
              echo "Career and news scanning completed"
              exit 0
            fi
            echo "::warning::HUNT scanner failed (attempt $ATTEMPT of 2)"
            if [ "$ATTEMPT" != 2 ]; then sleep 10; fi
          done
          echo "::error::HUNT sources unavailable after a bounded retry; previous data preserved"
          exit 1
      - name: Create high-priority alerts
        id: github_alerts
        if: steps.scan_data.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_github.py
      - name: Send HUNT push alerts
        id: push_alerts
        if: steps.scan_data.outcome == 'success'
        continue-on-error: true
        env:
          ONESIGNAL_APP_ID: "86341c64-d62a-4983-9e20-c242566d14ff"
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/notify_onesignal.py
      - name: Persist radar data
        id: persist
        if: steps.scan_data.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/hunt-data
          cp data/*.json /tmp/hunt-data/
          rm -f /tmp/hunt-data/chatgpt_alerts.json /tmp/hunt-data/chatgpt_outreach.json
          git config user.name "HUNT Radar"
          git config user.email "actions@users.noreply.github.com"
          CHANGED=false
          PERSISTED=false
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hunt-data/*.json data/
            git add data/
            if git diff --cached --quiet; then
              echo "No new data to publish"
              PERSISTED=true
              break
            fi
            git commit -m "radar: update opportunities"
            if git push origin HEAD:main; then
              CHANGED=true
              PERSISTED=true
              break
            fi
            echo "::warning::Concurrent repository write; retry $ATTEMPT of 5"
            sleep $((ATTEMPT * 2))
          done
          if [ "$PERSISTED" != "true" ]; then
            echo "::error::HUNT Radar could not persist its refreshed data after 5 attempts"
            exit 1
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
      - name: Record a single operational incident for persistent scanner failures
        if: always() && (steps.scan_data.outcome != 'success' || steps.persist.outcome != 'success' || steps.github_alerts.outcome == 'failure' || steps.push_alerts.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='HUNT · aggiornamento dati o notifiche bloccato';
            const runUrl=context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const body=[
              'HUNT ha rilevato un problema nel radar o nelle notifiche. I dati precedentemente pubblicati restano disponibili.',
              '',
              'Esecuzione iniziale: '+runUrl,
              '',
              'Non vengono aggiunti nuovi commenti a ogni tentativo fallito.',
              'L’incidente sarà chiuso dopo un ciclo completo riuscito.'
            ].join('\\n');
            core.warning('HUNT radar degradation; see consolidated incident.');
            await core.summary.addHeading('HUNT · scansione da recuperare')
              .addRaw('Ultima esecuzione: '+runUrl+'. Le versioni precedentemente pubblicate sono conservate.')
              .write();
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            if(!issues.some(x=>!x.pull_request&&x.title===title)){
              await github.rest.issues.create({owner,repo,title,body});
            }
      - name: Automatically resolve scanner incident after successful recovery
        if: steps.scan_data.outcome == 'success' && steps.persist.outcome == 'success' && steps.github_alerts.outcome == 'success' && steps.push_alerts.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const title='HUNT · aggiornamento dati o notifiche bloccato';
            const issues=await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const incident=issues.find(x=>!x.pull_request&&x.title===title);
            if(incident){
              await github.rest.issues.update({owner,repo,issue_number:incident.number,state:'closed'});
              core.info('HUNT scanner recovered; incident closed.');
            }
