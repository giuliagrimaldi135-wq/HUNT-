name: HUNT Radar
# HUNT matcher v1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/hunt-radar.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: hunt-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Scan career sources
        run: python scripts/scan_jobs.py
      - name: Scan public expansion/news signals
        run: python scripts/scan_news.py
      - name: Create high-priority alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_github.py
      - name: Persist radar data
        run: |
          mkdir -p /tmp/hunt-data
          cp data/*.json /tmp/hunt-data/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/hunt-data/*.json data/
          git config user.name "HUNT Radar"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "radar: update opportunities"
            git push origin HEAD:main
          fi
