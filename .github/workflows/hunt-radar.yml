name: HUNT Radar
# HUNT matcher v1.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/hunt-radar.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: hunt-radar
  cancel-in-progress: false
jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Scan career sources
        run: python scripts/scan_jobs.py
      - name: Scan public expansion/news signals
        run: python scripts/scan_news.py
      - name: Create high-priority alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_github.py
      - name: Persist radar data
        id: persist
        run: |
          mkdir -p /tmp/hunt-data
          cp data/*.json /tmp/hunt-data/
          git config user.name "HUNT Radar"
          git config user.email "actions@users.noreply.github.com"
          CHANGED=false
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/hunt-data/*.json data/
            git add data/
            if git diff --cached --quiet; then
              echo "No data changes"
              CHANGED=false
              break
            fi
            git commit -m "radar: update opportunities"
            if git push origin HEAD:main; then
              CHANGED=true
              break
            fi
            echo "Concurrent update detected; retrying"
            sleep 2
          done
          if [ "$CHANGED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.persist.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.persist.outputs.changed == 'true'
        with:
          path: "."
      - name: Deploy refreshed HUNT data
        id: deployment
        if: steps.persist.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
