name: HUNT 2.0 Core Tests

on:
  push:
    paths:
      - "v2/services/**"
      - "scripts/**"
      - ".github/workflows/hunt-radar.yml"
      - "v2/web/lib/data/**"
      - "v2/web/**"
      - "hunt2-preview/**"
      - ".github/workflows/hunt-v2-tests.yml"
  pull_request:
    paths:
      - "v2/services/**"
      - "scripts/**"
      - ".github/workflows/hunt-radar.yml"
      - "v2/web/**"
      - "hunt2-preview/**"
      - "v2/supabase/functions/hunt-match-refresh/**"
      - "v2/supabase/functions/hunt-source-discovery/**"
      - "v2/supabase/functions/hunt-vacancy-monitor/**"
      - "v2/supabase/functions/hunt-ats-board-scan/**"
      - "v2/supabase/functions/hunt-ats-discovery/**"
      - "v2/supabase/functions/hunt-global-news/**"
      - "v2/supabase/functions/hunt-successfactors-public/**"
      - "v2/supabase/functions/hunt-description-repair/**"
      - "v2/supabase/functions/hunt-brand-website-repair/**"
      - ".github/workflows/hunt-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test legacy radar commit policy (prevent timestamp-only deploys)
        working-directory: .
        run: python -m unittest discover -s scripts -p test_radar_persist_policy.py -v
      - name: Test Vercel frontend-only build policy
        working-directory: .
        run: python -m unittest discover -s scripts -p test_hunt_vercel_ignore.py -v
      - name: Test freshness, official-job deduplication and CV evidence
        working-directory: v2/supabase/functions/hunt-match-refresh
        run: node --test recommendation-guard.test.mjs cv-evidence.test.mjs match-write-policy.test.mjs
      - name: Test explicit senior-title protection for entry career profiles
        working-directory: v2/supabase/functions/hunt-match-refresh
        run: node --test seniority-guard.test.mjs
      - name: Test original HUNT luxury onboarding, no-CV junior opportunity eligibility and user-targeted outreach
        working-directory: hunt2-preview
        run: node --test onboarding-locations.test.mjs preview-preference-policy.test.mjs
      - name: Check original luxury application syntax
        working-directory: .
        run: |
          node --input-type=module --check < hunt2-preview/app.js
          node --input-type=module --check < hunt2-preview/outreach-intelligence.js
      - name: Test verified official-job description recovery
        working-directory: v2/supabase/functions/hunt-description-repair
        run: node --test extract-description.test.mjs
      - name: Test rotating all career categories without missing jobs
        working-directory: v2/supabase/functions/hunt-successfactors-public
        run: node --test catalog-rotation.test.mjs
      - name: Test Prada Group Maison identity preservation
        working-directory: v2/supabase/functions/hunt-successfactors-public
        run: node --test prada-maison.test.mjs
      - name: Test SuccessFactors 503 recovery cooldown
        working-directory: v2/supabase/functions/hunt-successfactors-public
        run: node --test successfactors-retry-policy.test.mjs
      - name: Test SuccessFactors source health scoring
        working-directory: v2/supabase/functions/hunt-successfactors-public
        run: node --test scan-health.test.mjs
      - name: Test SAP SuccessFactors official microdata extraction
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test successfactors-microdata.test.mjs
      - name: Test canonical ATS ingestion and safe vacancy lifecycle
        working-directory: v2/supabase/functions/hunt-ats-board-scan
        run: node --test ats-ingestion-guard.test.mjs ats-source-health.test.mjs
      - name: Test world-wide Lever pagination and authoritative country codes
        working-directory: v2/supabase/functions/hunt-ats-board-scan
        run: node --test ats-world-coverage.test.mjs
      - name: Test shared fashion-group career URL deduplication
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test shared-source-policy.test.mjs
      - name: Test adaptive source backoff and recovery
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test source-health-policy.test.mjs
      - name: Test vacancy monitor isolation and confirmed closure policy
        working-directory: v2/supabase/functions/hunt-vacancy-monitor
        run: node --test monitor-policy.test.mjs
      - name: Test schema-compatible candidate review statuses
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test review-status.test.mjs
      - name: Test same-brand careers domain discovery and safe ATS redirects
        working-directory: v2/supabase/functions/hunt-ats-discovery
        run: node --test careers-link-policy.test.mjs
      - name: Test safe brand-site ATS discovery seeding
        working-directory: v2/supabase/functions/hunt-ats-discovery
        run: node --test website-seed-policy.test.mjs
      - name: Test official company news brand attribution and date integrity
        working-directory: v2/supabase/functions/hunt-company-intelligence
        run: node --test article-provenance.test.mjs
      - name: Test official vacancy reuse and exact 20-day cutoff
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test existing-official-job.test.mjs
      - name: Test Lever posting creation date provenance
        working-directory: v2/supabase/functions/hunt-ats-board-scan
        run: node --test lever-original-date.test.mjs
      - name: Test proven legacy navigation and HTML duplicate classification
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test review-queue-cleanup.test.mjs
      - name: Test sourcing role evidence and specialist risk exclusions
        working-directory: v2/supabase/functions/hunt-match-refresh
        run: node --test role-specialization.test.mjs
      - name: Test global news HTTP429 backoff and limited publisher concurrency
        working-directory: v2/supabase/functions/hunt-global-news
        run: node --test news-source-backoff.test.mjs
      - name: Test career link integrity and shared-group employer resolution
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test candidate-integrity.test.mjs
      - name: Test structured schema.org JobPosting discovery without fabricated vacancies
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test source-jsonld-links.test.mjs
      - name: Test official structured-country evidence without geographic guesses
        working-directory: v2/supabase/functions/hunt-source-discovery
        run: node --test official-location-country.test.mjs
      - name: Test verified brand website discovery
        working-directory: v2/supabase/functions/hunt-brand-website-repair
        run: node --test website-extraction.test.mjs
      - name: Test Next.js vacancy eligibility and authentic feed rules
        working-directory: v2/web/lib/data
        run: node --experimental-strip-types --test eligibility.test.mjs
      - name: Reject fabricated user feed data in production pages
        working-directory: v2/web
        run: |
          if grep -R -n '@/lib/demo' app; then
            echo "Production pages must not import invented demo content."
            exit 1
          fi
      - name: Install Next.js frontend dependencies
        working-directory: v2/web
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Typecheck real user pages and server actions
        working-directory: v2/web
        run: npm run typecheck
      - name: Build authenticated HUNT frontend
        working-directory: v2/web
        run: npm run build
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run HUNT 2.0 core tests
        run: python -m pytest -q
