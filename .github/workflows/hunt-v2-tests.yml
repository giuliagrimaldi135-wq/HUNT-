name: HUNT 2.0 Core Tests

on:
  push:
    paths:
      - "v2/services/**"
      - ".github/workflows/hunt-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run HUNT 2.0 core tests
        run: python -m pytest -q
