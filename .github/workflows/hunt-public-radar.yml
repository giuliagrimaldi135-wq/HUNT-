name: HUNT Public Radar (no Supabase)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hunt2-preview/radar/refresh.py"
      - "hunt2-preview/radar/boards.json"
      - ".github/workflows/hunt-public-radar.yml"

permissions:
  contents: write

concurrency:
  group: hunt-public-radar
  cancel-in-progress: false

jobs:
  refresh-public-ats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test public ATS parse and privacy policies
        run: python -m unittest discover -s hunt2-preview/radar -p "test_*.py" -v
      - name: Fetch limited public official ATS feeds directly (zero Supabase requests)
        run: python hunt2-preview/radar/refresh.py
      - name: Validate safe public JSON before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('hunt2-preview/radar/jobs.json').read_text())
          assert p['sources_successful'] >= 1
          assert 1 <= len(p['jobs']) <= 4000
          assert all('email' not in x and 'cv' not in x and 'match_score' not in x for x in p['jobs'])
          assert all(x['url'].startswith('https://') for x in p['jobs'])
          print('Validated', len(p['jobs']), 'public job records')
          s=Path('hunt2-preview/radar/sitemap-state.json')
          if s.exists():
              state=json.loads(s.read_text())
              for brand, pages in state.items():
                  assert all(u.startswith('https://') for u in pages)
                  assert all(set(v) <= {'status','checked_at','date_posted'} for v in pages.values())
              print('Validated sitemap state for', len(state), 'source(s)')
          PY
      - name: Publish only updated public vacancies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hunt2-preview/radar/jobs.json
          if [ -f hunt2-preview/radar/sitemap-state.json ]; then git add hunt2-preview/radar/sitemap-state.json; fi
          if git diff --cached --quiet; then
            echo 'No public data changes'
            exit 0
          fi
          git commit -m "data: refresh independent public fashion radar"
          # main may move during a long run (merges, other automations). Only this
          # workflow writes the radar files and runs are serialized, so rebasing the
          # single data commit onto the new main cannot conflict.
          for ATTEMPT in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main moved during the run; rebasing and retrying ($ATTEMPT/5)"
            sleep $((ATTEMPT * 3))
            git pull --rebase origin main || { git rebase --abort || true; echo "::error::Rebase failed"; exit 1; }
          done
          echo "::error::Could not publish the refreshed public radar after 5 attempts"
          exit 1
